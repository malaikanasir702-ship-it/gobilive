<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobiLive — Next-Gen Live Streaming & Video Platform</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- FontAwesome 6 Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <style>
    /* ── RESET & PIXEL-PERFECT DESIGN SYSTEM ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-outer: #E2E8F0;
      --bg-frame: #F1F5F9;
      --card-white: #FFFFFF;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --primary-red: #E11D48;
      --radius-frame: 2rem;
      --radius-card: 1.5rem;
      --radius-pill: 100px;
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.08);
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-outer);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
      font-family: inherit;
    }

    /* ── DASHBOARD WINDOW FRAME ── */
    .dashboard-window {
      width: 100%;
      max-width: 1440px;
      background-color: var(--bg-frame);
      border-radius: var(--radius-frame);
      padding: 1.5rem 1.75rem 2rem 1.75rem;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* ── TOP HEADER / NAVBAR ── */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Search Bar */
    .search-pill-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background-color: var(--card-white);
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-pill);
      width: 250px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .search-pill-box:focus-within {
      width: 290px;
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
    }

    .search-pill-box i {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .search-pill-box input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-dark);
      width: 100%;
    }

    /* Category Pills Navbar */
    .category-nav-pills {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
    }

    .category-pill {
      padding: 0.65rem 1.35rem;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      background-color: transparent;
      transition: var(--transition);
      white-space: nowrap;
    }

    .category-pill:hover {
      color: var(--text-dark);
    }

    .category-pill.active {
      background-color: var(--primary-red);
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
    }

    /* Header Actions (Right) */
    .header-actions-right {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .icon-circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: var(--card-white);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      font-size: 1.05rem;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .icon-circle-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .user-profile-pill {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background-color: var(--card-white);
      padding: 0.35rem 0.85rem 0.35rem 0.35rem;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .user-profile-pill:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .user-avatar-img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-name-text {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .playstore-badge-header img {
      height: 40px;
      transition: var(--transition);
    }

    .playstore-badge-header img:hover {
      transform: translateY(-2px);
    }

    .admin-login-header-btn {
      background: linear-gradient(135deg, #7C3AED, #DB2777);
      color: #FFF;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 0.65rem 1.15rem;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
      transition: var(--transition);
    }

    .admin-login-header-btn:hover {
      transform: translateY(-2px);
    }

    /* ── MAIN LAYOUT BODY (SIDEBAR + CONTENT) ── */
    .dashboard-body {
      display: flex;
      gap: 1.75rem;;
    }

    /* ── LEFT SIDEBAR ── */
    .left-sidebar {
      width: 240px;
      background-color: var(--card-white);
      border-radius: var(--radius-card);
      padding: 1.75rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2rem;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .brand-logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-left: 0.5rem;
    }

    .brand-logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .brand-title-red {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--primary-red);
      letter-spacing: -0.3px;
    }

    .sidebar-nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .sidebar-nav-item a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.925rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: var(--transition);
      position: relative;
    }

    .sidebar-nav-item.active a,
    .sidebar-nav-item a:hover {
      color: var(--primary-red);
    }

    .sidebar-nav-item a i {
      font-size: 1.1rem;
      width: 20px;
      text-align: center;
    }

    .active-red-dot {
      width: 6px;
      height: 6px;
      background-color: var(--primary-red);
      border-radius: 50%;
      margin-left: auto;
    }

    .sidebar-divider {
      height: 1px;
      background-color: #F1F5F9;
      margin: 0.75rem 0;
    }

    /* Continue Watching Section */
    .continue-watching-section {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .continue-header-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
      padding-left: 0.25rem;
    }

    .continue-watching-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .continue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .continue-item:hover {
      transform: translateX(3px);
    }

    .continue-thumb {
      width: 44px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }

    .continue-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .continue-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 110px;
    }

    .continue-sub {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .continue-play-btn {
      background: transparent;
      color: var(--text-dark);
      font-size: 0.75rem;
    }

    /* ── MAIN CONTENT AREA ── */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      min-width: 0;
    }

    /* ── HERO SPOTLIGHT BANNER CARD ── */
    .hero-spotlight-card {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: var(--radius-card);
      overflow: hidden;
      background-color: #000;
      box-shadow: var(--shadow-md);
    }

    .hero-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.75;
      transition: transform 0.6s ease;
    }

    .hero-spotlight-card:hover .hero-bg-image {
      transform: scale(1.02);
    }

    .hero-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.1) 0%,
        rgba(0, 0, 0, 0.75) 70%,
        rgba(0, 0, 0, 0.9) 100%
      );
    }

    .hero-inner-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2.25rem;
      z-index: 10;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 620px;
    }

    .trending-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 0.35rem 0.85rem;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 700;
      color: #FFFFFF;
      width: fit-content;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .hero-main-title {
      font-size: 2.1rem;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .hero-meta-row {
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .hero-description-text {
      font-size: 0.875rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.75);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-buttons-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-top: 0.4rem;
    }

    .btn-watch-main {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #FFFFFF;
      color: #000000;
      font-weight: 800;
      font-size: 0.9rem;
      padding: 0.7rem 1.6rem;
      border-radius: var(--radius-pill);
      transition: var(--transition);
    }

    .btn-watch-main:hover {
      background-color: var(--primary-red);
      color: #FFFFFF;
      transform: translateY(-2px);
    }

    .btn-download-main {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.7rem 1.4rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: var(--transition);
    }

    .btn-download-main:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .btn-circle-action {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: var(--transition);
    }

    /* Right Hero Navigation Arrows */
    .hero-nav-arrows {
      position: absolute;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 15;
    }

    .hero-arrow-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: var(--transition);
    }

    .hero-arrow-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.08);
    }

    /* ── "YOU MIGHT LIKE" SECTION ── */
    .you-might-like-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .section-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-header-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.3px;
    }

    .see-all-text-link {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .see-all-text-link:hover {
      color: var(--primary-red);
    }

    .you-might-like-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    /* Card Item (Reference Image Replica) */
    .card-item {
      position: relative;
      border-radius: var(--radius-card);
      overflow: hidden;
      height: 210px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .card-item:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .card-thumb-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .card-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card-item:hover .card-thumb-img {
      transform: scale(1.05);
    }

    .card-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0) 30%,
        rgba(0, 0, 0, 0.75) 75%,
        rgba(0, 0, 0, 0.9) 100%
      );
    }

    .card-bottom-content {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1.25rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 0.5rem;
      z-index: 10;
      color: #FFFFFF;
    }

    .card-text-block {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      max-width: 170px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
    }

    .card-red-play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--primary-red);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.4);
      transition: var(--transition);
      flex-shrink: 0;
    }

    .card-item:hover .card-red-play-btn {
      transform: scale(1.1);
    }

    /* Empty State Card Styling */
    .empty-state-card {
      background-color: var(--card-white);
      border-radius: var(--radius-card);
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── INTERACTIVE MEDIA MODAL ── */
    .media-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .media-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .media-modal-box {
      background-color: #0F172A;
      border-radius: var(--radius-card);
      max-width: 580px;
      width: 90%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .modal-close-x {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      z-index: 30;
      cursor: pointer;
      border: none;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .you-might-like-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 0.5rem;
      }
      .dashboard-body {
        flex-direction: column;
      }
      .left-sidebar {
        width: 100%;
      }
      .you-might-like-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- ── DASHBOARD WINDOW FRAME ── -->
  <div class="dashboard-window">

    <!-- ── TOP HEADER / NAVBAR ── -->
    <header class="top-header">
      <!-- Search Input -->
      <div class="search-pill-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search" />
      </div>

      <!-- Categories Pills -->
      <nav class="category-nav-pills">
        <button class="category-pill active" data-cat="all">Shorts</button>
        <button class="category-pill" data-cat="live">Live Rooms</button>
        <button class="category-pill" data-cat="pk">PK Battles</button>
        <button class="category-pill" data-cat="teenpatti">Teen Patti</button>
        <button class="category-pill" data-cat="plinko">Plinko</button>
        <button class="category-pill" data-cat="more">More</button>
      </nav>

      <!-- Right Header Actions -->
      <div class="header-actions-right">
        <!-- Notification Bell -->
        <button class="icon-circle-btn" title="Notifications">
          <i class="fa-regular fa-bell"></i>
        </button>

        <!-- User Profile Pill -->
        <div class="user-profile-pill" id="userProfilePill">
          <img
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop"
            class="user-avatar-img"
            id="userPillAvatar"
            alt="User"
          />
          <span class="user-name-text">
            <span id="userPillName">Alex Morgan</span>
            <i class="fa-solid fa-chevron-down text-xs"></i>
          </span>
        </div>

        <!-- Google Play Store Badge -->
        <a
          href="https://play.google.com/store/apps/details?id=com.gobilive.gobilive_app"
          target="_blank"
          class="playstore-badge-header"
        >
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
            alt="Get it on Google Play"
          />
        </a>

        <!-- Admin Portal Login Button -->
        <a href="/admin" class="admin-login-header-btn">
          <i class="fa-solid fa-user-shield"></i> Admin
        </a>
      </div>
    </header>

    <!-- ── DASHBOARD BODY (SIDEBAR + MAIN CONTENT) ── -->
    <div class="dashboard-body">

      <!-- ── LEFT SIDEBAR ── -->
      <aside class="left-sidebar">
        <div>
          <!-- Logo & Brand -->
          <div class="brand-logo-container">
            <img src="/logo.png" class="brand-logo-img" alt="GlobiLive Logo" />
            <div class="brand-title-red">GLOBILIVE</div>
          </div>

          <!-- Main Nav List -->
          <ul class="sidebar-nav-list" style="margin-top:1.5rem;">
            <li class="sidebar-nav-item">
              <a href="javascript:void(0)"><i class="fa-solid fa-house"></i> <span>Home</span></a>
            </li>
            <li class="sidebar-nav-item active">
              <a href="javascript:void(0)">
                <i class="fa-solid fa-compass"></i>
                <span>Explore</span>
                <div class="active-red-dot"></div>
              </a>
            </li>
            <li class="sidebar-nav-item">
              <a href="javascript:void(0)"><i class="fa-regular fa-heart"></i> <span>Favorite</span></a>
            </li>

            <div class="sidebar-divider"></div>

            <li class="sidebar-nav-item">
              <a href="javascript:void(0)"><i class="fa-regular fa-user"></i> <span>Profile</span></a>
